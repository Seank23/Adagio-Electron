name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Every dependency, RubberBand included, comes from FetchContent at a pinned tag.
      - name: Configure
        run: cmake -S engine -B engine/build

      - name: Build
        run: cmake --build engine/build --config Release

      # Cases that reproduce a known bug carry doctest::should_fail, so a green
      # run here means "the bugs behave exactly as the review described". A
      # should_fail case that starts passing is the signal that a fix landed and
      # the decoration should come off.
      - name: Test
        run: ctest --test-dir engine/build -C Release --output-on-failure

      # Drives a real engine process through the command sequences that used to
      # crash or hang it. Hosted runners have no audio endpoint, so the playback
      # cases report themselves as skipped rather than failing.
      - name: Smoke test
        run: pwsh engine/tests/smoke.ps1

  ui:
    name: UI lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: app/ui

      - name: Lint
        run: npm run lint
        working-directory: app/ui
