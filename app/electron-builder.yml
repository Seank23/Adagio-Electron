appId: com.sksoftware.adagio
productName: Adagio
copyright: Copyright © 2026 SK Software
directories:
  # Not "dist": electron-builder excludes its own output directory from the packaged
  # files, and Vite builds the UI into dist/ui.
  output: release
files:
  - package.json
  - electron/**/*
  - dist/ui/**/*
extraResources:
  - from: engine-bin/
    to: engine/
    filter:
      - "**/*"
# The GPL goes beside Adagio.exe, next to Electron's own LICENSE.electron.txt.
extraFiles:
  - from: ../LICENSE
    to: LICENSE.txt
win:
  # Built from asset/Adagio_Logo.png at 16 to 256 px; the installer uses it too.
  icon: ../asset/Adagio_Icon.ico
