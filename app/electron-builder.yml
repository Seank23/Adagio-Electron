appId: com.example.adagio
productName: Adagio
directories:
  # Not "dist": electron-builder excludes its own output directory from the packaged
  # files, and Vite builds the UI into dist/ui.
  output: release
files:
  - package.json
  - electron/**/*
  - dist/ui/**/*
extraResources:
  - from: engine-bin/
    to: engine/
    filter:
      - "**/*"
